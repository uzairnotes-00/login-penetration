<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forums</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
    .topbar { background: #1a1a2e; padding: 14px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    .topbar h1 { color: #00ff88; font-size: 20px; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .topbar .user-label { color: #888; font-size: 14px; }
    .topbar .user-name { color: #00ff88; font-weight: bold; }
    .topbar button { padding: 8px 16px; border: 1px solid #444; border-radius: 6px; background: #16213e; color: #aaa; cursor: pointer; font-size: 13px; transition: all 0.3s; }
    .topbar button:hover { border-color: #00ff88; color: #00ff88; }
    .main { max-width: 800px; margin: 30px auto; padding: 0 20px; }
    .btn-new { display: inline-block; padding: 12px 24px; background: #00ff88; color: #0a0a0a; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 24px; transition: background 0.3s; }
    .btn-new:hover { background: #00cc6a; }
    .thread-list { list-style: none; }
    .thread-item { background: #1a1a2e; border: 1px solid #333; border-radius: 8px; padding: 18px 22px; margin-bottom: 12px; cursor: pointer; transition: border-color 0.3s; }
    .thread-item:hover { border-color: #00ff88; }
    .thread-title { color: #e0e0e0; font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .thread-meta { color: #666; font-size: 13px; }
    .thread-meta .author { color: #00ff88; }
    .empty-msg { text-align: center; color: #555; margin-top: 60px; font-size: 16px; }

    .editor-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
    .editor-overlay.active { display: flex; }
    .editor { background: #1a1a2e; border: 1px solid #333; border-radius: 12px; padding: 30px; width: 600px; max-width: 95vw; }
    .editor h2 { color: #00ff88; margin-bottom: 20px; font-size: 20px; }
    .editor label { display: block; margin-bottom: 6px; color: #aaa; font-size: 14px; }
    .editor input, .editor textarea { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 6px; background: #16213e; color: #fff; font-size: 15px; outline: none; font-family: inherit; margin-bottom: 16px; transition: border 0.3s; }
    .editor input:focus, .editor textarea:focus { border-color: #00ff88; }
    .editor textarea { min-height: 160px; resize: vertical; }
    .editor-btns { display: flex; gap: 12px; justify-content: flex-end; }
    .editor-btns button { padding: 10px 22px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
    .btn-save { background: #00ff88; color: #0a0a0a; }
    .btn-save:hover { background: #00cc6a; }
    .btn-cancel { background: #333; color: #aaa; }
    .btn-cancel:hover { background: #444; }
    .btn-delete { background: #ff4444; color: #fff; margin-right: auto; }
    .btn-delete:hover { background: #cc0000; }

    .view-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
    .view-overlay.active { display: flex; }
    .view-panel { background: #1a1a2e; border: 1px solid #333; border-radius: 12px; padding: 30px; width: 600px; max-width: 95vw; max-height: 80vh; overflow-y: auto; }
    .view-panel h2 { color: #e0e0e0; margin-bottom: 10px; font-size: 20px; }
    .view-panel .view-meta { color: #666; font-size: 13px; margin-bottom: 18px; }
    .view-panel .view-meta .author { color: #00ff88; }
    .view-panel .view-body { color: #ccc; font-size: 15px; line-height: 1.7; white-space: pre-wrap; margin-bottom: 20px; }
    .view-btns { display: flex; gap: 12px; justify-content: flex-end; }
    .view-btns button { padding: 10px 22px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
    .btn-close { background: #333; color: #aaa; }
    .btn-close:hover { background: #444; }
    .btn-edit { background: #0f3460; color: #00ff88; border: 1px solid #00ff88 !important; }
    .btn-edit:hover { background: #0f3460; }

    #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; font-size: 14px; display: none; z-index: 200; }
    #toast.success { display: block; background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid #00ff88; }
    #toast.error { display: block; background: rgba(255,0,0,0.15); color: #ff4444; border: 1px solid #ff4444; }
  </style>
  <!-- Vercel Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="topbar">
    <h1>&#x1f4ac; Forums</h1>
    <div class="topbar-right">
      <span class="user-label">Logged in as <span class="user-name" id="currentUser"></span></span>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="main">
    <button class="btn-new" onclick="openEditor()">+ New Thread</button>
    <ul class="thread-list" id="threadList"></ul>
    <div class="empty-msg" id="emptyMsg" style="display:none;">No threads yet. Start the conversation!</div>
  </div>

  <div class="editor-overlay" id="editorOverlay">
    <div class="editor">
      <h2 id="editorTitle">New Thread</h2>
      <label>Title</label>
      <input type="text" id="editInput" placeholder="Thread title">
      <label>Body</label>
      <textarea id="editBody" placeholder="Write your message..."></textarea>
      <div class="editor-btns">
        <button class="btn-delete hidden" id="deleteBtn" onclick="deleteThread()">Delete</button>
        <button class="btn-cancel" onclick="closeEditor()">Cancel</button>
        <button class="btn-save" onclick="saveThread()">Post</button>
      </div>
    </div>
  </div>

  <div class="view-overlay" id="viewOverlay">
    <div class="view-panel">
      <h2 id="viewTitle"></h2>
      <div class="view-meta" id="viewMeta"></div>
      <div class="view-body" id="viewBody"></div>
      <div class="view-btns">
        <button class="btn-close" onclick="closeView()">Close</button>
        <button class="btn-edit hidden" id="viewEditBtn" onclick="editFromView()">Edit</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const currentUser = localStorage.getItem("forumUser");
    if (!currentUser) { window.location.href = "/"; }

    document.getElementById("currentUser").textContent = currentUser;

    let threads = [];
    let editingId = null;

    function toast(msg, type) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = type;
      setTimeout(() => { t.className = ""; }, 3000);
    }

    async function loadThreads() {
      try {
        const res = await fetch("/api/threads");
        threads = await res.json();
        render();
      } catch (e) {
        toast("Failed to load threads", "error");
      }
    }

    function render() {
      const list = document.getElementById("threadList");
      const empty = document.getElementById("emptyMsg");
      if (threads.length === 0) {
        list.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";
      list.innerHTML = threads.map(t => `
        <li class="thread-item" onclick="viewThread('${t.id}')">
          <div class="thread-title">${esc(t.title)}</div>
          <div class="thread-meta">
            by <span class="author">${esc(t.username)}</span> &mdash; ${new Date(t.updatedAt).toLocaleString()}
          </div>
        </li>
      `).join("");
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function openEditor(id) {
      editingId = id || null;
      const overlay = document.getElementById("editorOverlay");
      const title = document.getElementById("editorTitle");
      const input = document.getElementById("editInput");
      const body = document.getElementById("editBody");
      const del = document.getElementById("deleteBtn");

      if (editingId) {
        const t = threads.find(x => x.id === editingId);
        title.textContent = "Edit Thread";
        input.value = t.title;
        body.value = t.body;
        del.classList.remove("hidden");
      } else {
        title.textContent = "New Thread";
        input.value = "";
        body.value = "";
        del.classList.add("hidden");
      }
      overlay.classList.add("active");
    }

    function closeEditor() {
      document.getElementById("editorOverlay").classList.remove("active");
      editingId = null;
    }

    async function saveThread() {
      const title = document.getElementById("editInput").value.trim();
      const body = document.getElementById("editBody").value.trim();
      if (!title || !body) return toast("Fill in all fields", "error");

      try {
        if (editingId) {
          const res = await fetch("/api/threads", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: editingId, username: currentUser, title, body })
          });
          if (!res.ok) { const d = await res.json(); return toast(d.error, "error"); }
          toast("Thread updated", "success");
        } else {
          const res = await fetch("/api/threads", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: currentUser, title, body })
          });
          if (!res.ok) { const d = await res.json(); return toast(d.error, "error"); }
          toast("Thread posted", "success");
        }
        closeEditor();
        closeView();
        await loadThreads();
      } catch (e) {
        toast("Error: " + e.message, "error");
      }
    }

    async function deleteThread() {
      if (!editingId) return;
      if (!confirm("Delete this thread?")) return;
      try {
        const res = await fetch("/api/threads", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: editingId, username: currentUser })
        });
        if (!res.ok) { const d = await res.json(); return toast(d.error, "error"); }
        toast("Thread deleted", "success");
        closeEditor();
        closeView();
        await loadThreads();
      } catch (e) {
        toast("Error: " + e.message, "error");
      }
    }

    function viewThread(id) {
      const t = threads.find(x => x.id === id);
      if (!t) return;
      document.getElementById("viewTitle").textContent = t.title;
      document.getElementById("viewMeta").innerHTML = `by <span class="author">${esc(t.username)}</span> &mdash; ${new Date(t.createdAt).toLocaleString()} (edited ${new Date(t.updatedAt).toLocaleString()})`;
      document.getElementById("viewBody").textContent = t.body;
      const btn = document.getElementById("viewEditBtn");
      if (t.username === currentUser) {
        btn.classList.remove("hidden");
        btn.onclick = () => { closeView(); openEditor(t.id); };
      } else {
        btn.classList.add("hidden");
      }
      document.getElementById("viewOverlay").classList.add("active");
    }

    function closeView() {
      document.getElementById("viewOverlay").classList.remove("active");
    }

    function editFromView() {}

    function logout() {
      localStorage.removeItem("forumUser");
      window.location.href = "/";
    }

    loadThreads();
  </script>
</body>
</html>
