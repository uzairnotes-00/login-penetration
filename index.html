<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background: #1a1a2e; padding: 40px; border-radius: 12px; box-shadow: 0 0 30px rgba(0, 255, 136, 0.1); width: 400px; }
    h1 { text-align: center; color: #00ff88; margin-bottom: 30px; font-size: 28px; }
    .tabs { display: flex; margin-bottom: 25px; }
    .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border: 1px solid #333; background: #16213e; color: #888; transition: all 0.3s; }
    .tab:first-child { border-radius: 8px 0 0 8px; }
    .tab:last-child { border-radius: 0 8px 8px 0; }
    .tab.active { background: #0f3460; color: #00ff88; border-color: #00ff88; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; color: #aaa; font-size: 14px; }
    input { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 6px; background: #16213e; color: #fff; font-size: 16px; outline: none; transition: border 0.3s; }
    input:focus { border-color: #00ff88; }
    button { width: 100%; padding: 14px; border: none; border-radius: 6px; background: #00ff88; color: #0a0a0a; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #00cc6a; }
    #message { margin-top: 15px; padding: 12px; border-radius: 6px; text-align: center; display: none; font-size: 14px; }
    #message.success { display: block; background: rgba(0,255,136,0.1); color: #00ff88; border: 1px solid #00ff88; }
    #message.error { display: block; background: rgba(255,0,0,0.1); color: #ff4444; border: 1px solid #ff4444; }
    .users-list { margin-top: 20px; }
    .users-list h3 { color: #00ff88; margin-bottom: 10px; font-size: 16px; }
    .user-item { padding: 8px 12px; background: #16213e; border-radius: 4px; margin-bottom: 6px; font-size: 13px; color: #aaa; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>&#x1f510; Login Portal</h1>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Login</div>
      <div class="tab" onclick="switchTab('signup')">Sign Up</div>
    </div>

    <div id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Enter password">
      </div>
      <button onclick="login()">Login</button>
    </div>

    <div id="signupForm" class="hidden">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="signupUser" placeholder="Choose a username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPass" placeholder="Choose a password">
      </div>
      <button onclick="signup()">Sign Up</button>
    </div>

    <div id="message"></div>
    <div class="users-list" id="usersList"></div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('signupForm').classList.toggle('hidden', tab !== 'signup');
      clearMessage();
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = type;
    }

    function clearMessage() {
      document.getElementById('message').className = '';
    }

    async function signup() {
      const username = document.getElementById('signupUser').value.trim();
      const password = document.getElementById('signupPass').value;
      if (!username || !password) return showMessage('Fill in all fields', 'error');

      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      showMessage(data.message || data.error, res.ok ? 'success' : 'error');
      if (res.ok) loadUsers();
    }

    async function login() {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      if (!username || !password) return showMessage('Fill in all fields', 'error');

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      showMessage(data.message || data.error, res.ok ? 'success' : 'error');
    }

    async function loadUsers() {
      const res = await fetch('/api/users');
      const users = await res.json();
      const el = document.getElementById('usersList');
      if (users.length === 0) { el.innerHTML = ''; return; }
      el.innerHTML = '<h3>Registered Users</h3>' +
        users.map(u => `<div class="user-item">${u.username} &mdash; ${new Date(u.createdAt).toLocaleString()}</div>`).join('');
    }

    loadUsers();
  </script>
</body>
</html>
